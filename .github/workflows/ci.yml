name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run mypy src/cursus/ --ignore-missing-imports

      - name: Unit tests
        run: uv run pytest tests/unit/ -v

  saga-db-integration:
    name: Saga PostgreSQL + MySQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cursus
          POSTGRES_PASSWORD: cursus
          POSTGRES_DB: cursus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cursus -d cursus"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cursus
          MYSQL_USER: cursus
          MYSQL_PASSWORD: cursus
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CURSUS_SAGA_POSTGRES_DSN: postgresql://cursus:cursus@localhost:5432/cursus
      CURSUS_SAGA_MYSQL_DSN: mysql://cursus:cursus@localhost:3306/cursus
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --extra dev --extra postgres --extra mysql
      - name: Verify transactional Saga adapters and history outbox retry
        run: uv run pytest tests/integration/test_sagapg.py tests/integration/test_sagamysql.py -v

  event-store-e2e:
    name: Event sourcing Broker E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cursus
          POSTGRES_PASSWORD: cursus
          POSTGRES_DB: cursus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cursus -d cursus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Cursus Broker
        uses: actions/checkout@v7
        with:
          repository: cursus-io/cursus
          path: cursus-broker
      - name: Start Cursus Broker
        working-directory: cursus-broker/test/e2e
        run: docker compose up --build --detach --wait
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - name: Verify EventStore append, conflict, snapshot, and replay
        env:
          CURSUS_TEST_BROKER_ADDR: localhost:10000
          CURSUS_SAGA_BROKER_ADDR: localhost:10000
          CURSUS_SAGA_POSTGRES_DSN: postgresql://cursus:cursus@localhost:5432/cursus
        run: >-
          uv run pytest tests/integration/test_eventstore.py
          tests/integration/test_saga_history_broker_e2e.py -v
      - name: Collect Broker logs
        if: always()
        working-directory: cursus-broker/test/e2e
        run: docker compose logs --no-color
      - name: Stop Cursus Broker
        if: always()
        working-directory: cursus-broker/test/e2e
        run: docker compose down --volumes --remove-orphans

  dco:
    name: DCO
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: DCO Check
        run: |
          commits=$(git log --no-merges --format='%H' origin/main..HEAD)
          for sha in $commits; do
            if ! git log -1 --format='%B' "$sha" | grep -q '^Signed-off-by:'; then
              echo "Commit $sha missing Signed-off-by"
              exit 1
            fi
          done
          echo "All commits have Signed-off-by"
